[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wz"
version = "0.1.1"
description = "Mission control for a team of AI agents: a lead, owned work, a job queue, a guard, and the owner's sign."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
]

[project.scripts]
wz = "wz.cli:main"

[tool.setuptools]
packages = ["wz"]

[tool.setuptools.package-data]
wz = ["templates/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
