name: Bug report
description: Something does not work as the README says
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Security problem? Do not post it here: use the private form described in SECURITY.md.
        Please remove tokens, keys and personal information from anything you paste.
  - type: input
    id: version
    attributes:
      label: wz version
      description: Output of `wz --version`
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: System and Python
      description: For example "macOS 15, Python 3.13" or "Ubuntu 24.04, Python 3.12"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What you did
      description: The commands, in order, from an empty folder if you can.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what happened instead
    validations:
      required: true
