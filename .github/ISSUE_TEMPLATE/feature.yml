name: Feature request
description: Something wz should do that it does not
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation first, then why the current behaviour does not work for it.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like wz to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you tried or considered instead
