name: secret-scan

# A generic secret scan (gitleaks, default rules) over the whole history on every push and pull request.
# The release binary is pinned by version and checked against a sha256 before it runs.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: install gitleaks (pinned, sha256 checked)
        run: |
          T=$(mktemp -d)
          curl -fsSL -o "$T/g.tgz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $T/g.tgz" | sha256sum -c -
          tar -xzf "$T/g.tgz" -C "$T" gitleaks
          echo "$T" >> "$GITHUB_PATH"
      - name: scan the history
        run: gitleaks git --redact --verbose --no-banner .
